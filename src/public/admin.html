<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Ninja Boost · Admin</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <!-- ============================ LOGIN ============================ -->
  <main id="login" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <img src="/logo.png" class="login-logo" alt="" />
      <h1>Admin panel</h1>
      <p class="muted">Sign in with your admin account, then the panel password.</p>
      <label>Username<input id="l-user" type="text" autocomplete="username" required /></label>
      <label>Password<input id="l-pass" type="password" autocomplete="current-password" required /></label>
      <label>Panel password<input id="l-panel" type="password" autocomplete="off" required /></label>
      <button class="btn btn-primary" type="submit" id="l-submit">Sign in</button>
      <p class="form-error" id="l-error" role="alert"></p>
    </form>
  </main>

  <!-- ============================= SHELL ============================ -->
  <div id="shell" class="shell hidden">
    <aside class="side" id="side">
      <a class="brand" href="/admin"><img src="/logo.png" alt="" /><span>Ninja Boost</span></a>
      <nav class="nav" id="nav" aria-label="Admin sections"></nav>
      <div class="side-foot">
        <a class="nav-link" href="/" target="_blank" rel="noopener" id="open-client"></a>
        <button class="nav-link" id="logout" type="button"></button>
      </div>
    </aside>

    <div class="content">
      <header class="top">
        <h2 id="view-title">Overview</h2>
        <div class="top-right">
          <span class="live" id="live" title="Auto-refreshing"><i></i>Live</span>
          <button class="btn btn-ghost btn-sm" id="refresh" type="button">Refresh</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
