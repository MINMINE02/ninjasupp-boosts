<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #060405;
    background-image:
      radial-gradient(900px 520px at 50% -10%, rgba(225, 29, 47, 0.26) 0%, rgba(127, 29, 29, 0.07) 38%, #060405 70%),
      linear-gradient(to right,  rgba(255, 90, 104, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 90, 104, 0.045) 1px, transparent 1px);
    background-size: 100% 100%, 46px 46px, 46px 46px;
    color: #fbeef0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    padding: 40px 34px;
    background: #12090b;
    border: 1px solid #3d1a20;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.70), inset 0 1px 0 rgba(255, 90, 104, 0.06);
  }
  .logo {
    width: 82px;
    height: 82px;
    object-fit: contain;
    margin-bottom: 22px;
    filter: drop-shadow(0 0 20px rgba(225, 29, 47, 0.55));
  }
  h1 {
    font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
    font-size: 28px;
    margin: 0 0 6px;
    color: #fbeef0;
  }
  h1 .accent { color: #ff5a68; }
  .rule {
    width: 72px; height: 3px; margin: 14px auto 20px;
    background: linear-gradient(90deg, #b3121f, #ff5a68);
    border-radius: 3px;
    box-shadow: 0 0 14px rgba(225, 29, 47, 0.55);
  }
  p {
    color: #b0929a;
    line-height: 1.6;
    margin: 0 0 8px;
    font-size: 15px;
  }
  .badge {
    display: inline-block;
    margin-top: 22px;
    padding: 8px 18px;
    font-family: "Poppins", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: #ff9aa3;
    background: rgba(225, 29, 47, 0.13);
    border: 1px solid #5c2229;
    border-radius: 8px;
  }
</style>
